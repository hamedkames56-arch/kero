<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>خروج</title>
<script>
window.onload = function() {
    // محاولة إغلاق التطبيق فور فتح الصفحة
    try {
        window.close();
    } catch(e) {}
    
    try {
        navigator.app.exitApp();
    } catch(e) {}
    
    try {
        Android.exit();
    } catch(e) {}
};
</script>
</head>
<body style="background:#26ab56; color:white; font-family:sans-serif; text-align:center; padding-top:20%;">
    <h3>جاري إغلاق التطبيق...</h3>
</body>
</html>
